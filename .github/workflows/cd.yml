name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environnement de deploiement
        required: true
        default: production

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recuperer le SHA court
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Construire et pousser l image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/evaluation-devops:latest
            ghcr.io/${{ github.repository_owner }}/evaluation-devops:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/evaluation-devops:v1.0.0

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Recuperer les informations de deploiement
        id: vars
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)

          $ancienneImage = docker inspect `
            --format "{{.Config.Image}}" `
            evaluation-devops-prod 2>$null

          "sha_short=$sha" >> $env:GITHUB_OUTPUT
          "previous_image=$ancienneImage" >> $env:GITHUB_OUTPUT

      - name: Connexion au registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recuperer la nouvelle image
        shell: powershell
        run: |
          docker pull `
            ghcr.io/${{ github.repository_owner }}/evaluation-devops:${{ steps.vars.outputs.sha_short }}

      - name: Deployer
        shell: powershell
        run: |
          $conteneur = docker ps -a `
            --filter "name=evaluation-devops-prod" `
            --format "{{.Names}}"

          if ($conteneur) {
            docker rm -f evaluation-devops-prod
          }

          docker run -d `
            --name evaluation-devops-prod `
            -p 5001:5000 `
            -e REDIS_HOST=host.docker.internal `
            -e COMMIT_SHA=${{ steps.vars.outputs.sha_short }} `
            ghcr.io/${{ github.repository_owner }}/evaluation-devops:${{ steps.vars.outputs.sha_short }}

      - name: Verification du deploiement
        shell: powershell
        run: |
          $ok = $false

          for ($i = 1; $i -le 3; $i++) {
            Start-Sleep -Seconds 5

            try {
              $response = Invoke-WebRequest `
                -Uri http://localhost:5001/health `
                -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                $ok = $true
                break
              }
            }
            catch {
            }
          }

          if (-not $ok) {
            docker rm -f evaluation-devops-prod

            $ancienneImage = "${{ steps.vars.outputs.previous_image }}"

            if ($ancienneImage) {
              docker pull $ancienneImage

              $ancienSha = $ancienneImage.Split(':')[-1]

              docker run -d `
                --name evaluation-devops-prod `
                -p 5001:5000 `
                -e REDIS_HOST=host.docker.internal `
                -e COMMIT_SHA=$ancienSha `
                $ancienneImage

              $rollbackOk = $false

              for ($i = 1; $i -le 3; $i++) {
                Start-Sleep -Seconds 5

                try {
                  $response = Invoke-WebRequest `
                    -Uri http://localhost:5001/health `
                    -UseBasicParsing

                  if ($response.StatusCode -eq 200) {
                    $rollbackOk = $true
                    break
                  }
                }
                catch {
                }
              }

              if (-not $rollbackOk) {
                Write-Error "Le rollback a echoue"
              }
            }

            exit 1
          }

groups:
  - name: application-alerts
    rules:

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m])) > 0.10
        for: 1m
        labels:
          severity: warning
        annotations:
          description: "Plus de 10% des requetes retournent une erreur 5xx"

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m]))
            by (le, endpoint)
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          description: "Le p95 depasse 500 ms"
